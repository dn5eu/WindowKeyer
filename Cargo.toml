[package]
name = "windowkeyer"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
gtk4 = "0.9"
glib = "0.20"
pango = "0.20"
# libadwaita wird aktuell im Code nicht verwendet (nur gtk4); Feature-Flags v1_4
# erfordern systemweit Adwaita >= 1.4. Deshalb als optionales Feature ausgegliedert.
libadwaita = { version = "0.7", features = ["v1_4"], optional = true }

# X11-Backend
x11rb = "0.13"

# Kommunikation
crossbeam-channel = "0.5"
thiserror = "2"

# Tray Icon (Nativ für KDE via D-Bus, kein GTK 3 Konflikt!)
ksni = "0.2"

[features]
default = []
adwaita = ["dep:libadwaita"]
